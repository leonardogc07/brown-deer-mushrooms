[build]
  command = "npm run build"
  publish = "dist"

# Netlify Forms: enable spam filtering on honeypot fields
[build.environment]
  NODE_VERSION = "20"

# Old Saturday URLs from social posts and QR codes.
[[redirects]]
  from = "/pickup"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pickup/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pickup.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pickup-thanks"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pickup-thanks/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pickup-thanks.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/kits"
  to = "/kits.html"
  status = 200

[[redirects]]
  from = "/kits-thanks"
  to = "/kits-thanks.html"
  status = 200
